document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

t,.ds-bs textarea.input{font-size:16px}\n.ds-bs .lbl-sub{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-neutral-700)}\n<\u002Fstyle>\n<script src=\"512a23e0-0a9f-475d-8f6f-b8030b2659cb\"><\u002Fscript>\n<script src=\"8900f082-e0ec-42cb-a54a-1cca65dbf0f1\"><\u002Fscript>\n<style>\nhtml,body{margin:0;height:100%;background:#e6e4e3}\n<\u002Fstyle>\n\n<\u002Fhelmet>\n<div class=\"app ds-bs\">\n  <div class=\"app-head row\" style=\"gap:10px\">\n    <sc-if value=\"{{ showBack }}\" hint-placeholder-val=\"{{ false }}\">\n      <button class=\"btn btn-secondary btn-icon\" sc-camel-on-click=\"{{ back }}\" aria-label=\"Back\">←<\u002Fbutton>\n    <\u002Fsc-if>\n    <div class=\"grow\">\n      <div class=\"kicker\">{{ headKicker }}<\u002Fdiv>\n      <div class=\"h-lead\">{{ headTitle }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"app-body\">\n\n    <sc-if value=\"{{ isCal }}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"pad sec\">\n        <div class=\"row\" style=\"justify-content:space-between;margin-bottom:10px\">\n          <div class=\"h-sec\">{{ monthLabel }}<\u002Fdiv>\n          <div class=\"row\" style=\"gap:6px\">\n            <button class=\"btn btn-secondary btn-icon\" sc-camel-on-click=\"{{ prevMonth }}\" aria-label=\"Previous month\">‹<\u002Fbutton>\n            <button class=\"btn btn-secondary btn-icon\" sc-camel-on-click=\"{{ nextMonth }}\" aria-label=\"Next month\">›<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"wd\">\n          <span>Mo<\u002Fspan><span>Tu<\u002Fspan><span>We<\u002Fspan><span>Th<\u002Fspan><span>Fr<\u002Fspan><span>Sa<\u002Fspan><span>Su<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"cal\">\n          <sc-for list=\"{{ cells }}\" as=\"c\" hint-placeholder-count=\"35\">\n            <button class=\"{{ c.cls }}\" style=\"{{ c.style }}\" data-d=\"{{ c.date }}\" disabled=\"{{ c.dis }}\" sc-camel-on-click=\"{{ onCell }}\">\n              <span class=\"num\">{{ c.num }}<\u002Fspan>\n              <span class=\"code\">{{ c.code }}<span class=\"house\">{{ c.house }}<\u002Fspan><span class=\"emoji\">{{ c.emoji }}<\u002Fspan><\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button class=\"btn btn-primary btn-block\" style=\"margin-top:14px\" sc-camel-on-click=\"{{ startToday }}\">{{ startLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ showMerge }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"pad sec\">\n          <div class=\"kicker\">List updated<\u002Fdiv>\n          <div class=\"muted mini\" style=\"margin:6px 0 10px\">{{ mergeReport }}<\u002Fdiv>\n          <button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ dismissMerge }}\">Got it<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ backupWarn }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"pad sec\">\n          <div class=\"alt\">{{ backupLabel }}<\u002Fdiv>\n          <div class=\"muted mini\" style=\"margin:6px 0 10px\">{{ backupHint }}<\u002Fdiv>\n          <button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ doBackupNow }}\">Save backup to Drive<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div class=\"pad sec\">\n        <div class=\"lbl\" style=\"margin-bottom:10px\">This week vs last<\u002Fdiv>\n        <div class=\"stack\" style=\"gap:10px\">\n          <sc-for list=\"{{ weekStats }}\" as=\"s\" hint-placeholder-count=\"4\">\n            <div class=\"row\" style=\"gap:12px;align-items:baseline\">\n              <div class=\"h-sec\" style=\"min-width:74px\">{{ s.val }}<\u002Fdiv>\n              <div class=\"muted mini grow\">{{ s.label }}<\u002Fdiv>\n              <div class=\"{{ s.cls }}\" style=\"font-size:12px\">{{ s.delta }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"pad sec\">\n        <div class=\"lbl\" style=\"margin-bottom:8px\">Bodyweight<\u002Fdiv>\n        <div class=\"row\" style=\"gap:12px;align-items:flex-end\">\n          <div class=\"field\">\n            <label>Today (kg)<\u002Flabel>\n            <input class=\"input bw-in\" inputmode=\"decimal\" placeholder=\"–\" value=\"{{ bwToday }}\" sc-camel-on-change=\"{{ onBw }}\">\n          <\u002Fdiv>\n          <div class=\"muted mini grow\" style=\"padding-bottom:8px\">{{ bwHint }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"pad\">\n        <div class=\"lbl\" style=\"margin-bottom:10px\">Day types<\u002Fdiv>\n        <div class=\"chips\" style=\"gap:10px 14px\">\n          <sc-for list=\"{{ legend }}\" as=\"l\" hint-placeholder-count=\"10\">\n            <span class=\"row\" style=\"gap:6px;font-size:11px\"><span class=\"{{ l.cls }}\" style=\"{{ l.style }}\"><\u002Fspan>{{ l.name }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div class=\"muted mini\" style=\"margin-top:12px\">Hollow marker and the house mark = home-gym version. Edit day types, exercises and notes under Setup.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isPick }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"pad sec\">\n        <div class=\"muted mini\">{{ pickDateLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stack\">\n        <sc-for list=\"{{ presetList }}\" as=\"d\" hint-placeholder-count=\"10\">\n          <button class=\"item\" data-k=\"{{ d.id }}\" sc-camel-on-click=\"{{ onPickDay }}\">\n            <span class=\"{{ d.cls }}\" style=\"{{ d.style }}\"><\u002Fspan>\n            <span class=\"grow\">\n              <span class=\"item-name\">{{ d.name }}<\u002Fspan>\n              <span class=\"muted\" style=\"display:block;font-size:11px\">{{ d.sub }}<\u002Fspan>\n            <\u002Fspan>\n            <span class=\"muted\">›<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isSession }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"pad sec\">\n        <div class=\"row\" style=\"justify-content:space-between;align-items:flex-start\">\n          <div>\n            <div class=\"lbl\">{{ sesDateLabel }}<\u002Fdiv>\n            <div class=\"h-sec\" style=\"margin-top:4px\">{{ sesDayName }}<\u002Fdiv>\n          <\u002Fdiv>\n          <span class=\"tag tag-accent\">{{ sesProgress }}<\u002Fspan>\n        <\u002Fdiv>\n        <button class=\"btn btn-ghost\" style=\"margin-top:8px;padding-inline:0\" sc-camel-on-click=\"{{ changeDay }}\">Change day type<\u002Fbutton>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ sesIsCardio }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"pad sec stack\" style=\"gap:12px\">\n          <div class=\"row\" style=\"gap:10px\">\n            <div class=\"field grow\">\n              <label>Type<\u002Flabel>\n              <sc-raw-select class=\"input\" value=\"{{ cType }}\" sc-camel-on-change=\"{{ onCType }}\">\n                <sc-for list=\"{{ cardioTypes }}\" as=\"t\" hint-placeholder-count=\"5\">\n                  <option value=\"{{ t.v }}\">{{ t.n }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <div class=\"field\" style=\"width:96px\">\n              <label>Duration<\u002Flabel>\n              <input class=\"input num-in\" inputmode=\"numeric\" placeholder=\"min\" value=\"{{ sesDur }}\" sc-camel-on-change=\"{{ onSesDur }}\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label>Intensity<\u002Flabel>\n            <sc-raw-select class=\"input\" value=\"{{ cInt }}\" sc-camel-on-change=\"{{ onCInt }}\">\n              <sc-for list=\"{{ intensities }}\" as=\"i\" hint-placeholder-count=\"5\">\n                <option value=\"{{ i }}\">{{ i }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label>Other — what exactly did you do<\u002Flabel>\n            <textarea class=\"input\" placeholder=\"Route, splits, how it felt…\" value=\"{{ cOther }}\" sc-camel-on-change=\"{{ onCOther }}\"><\u002Ftextarea>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ sesHasEx }}\" hint-placeholder-val=\"{{ true }}\">\n        <div class=\"stack\">\n          <sc-for list=\"{{ sesEx }}\" as=\"e\" hint-placeholder-count=\"6\">\n            <button class=\"item\" data-i=\"{{ e.idx }}\" sc-camel-on-click=\"{{ onOpenEx }}\">\n              <span class=\"idtag\">{{ e.id }}<\u002Fspan>\n              <span class=\"grow\">\n                <span class=\"item-name\">{{ e.name }}<\u002Fspan>\n                <span class=\"muted\" style=\"display:block;font-size:11px\">{{ e.sub }}<\u002Fspan>\n                <span class=\"alt\">{{ e.altNote }}<\u002Fspan>\n              <\u002Fspan>\n              <span class=\"{{ e.deltaCls }}\" style=\"font-size:11px;white-space:nowrap\">{{ e.delta }}<\u002Fspan>\n              <span class=\"tag tag-neutral\">{{ e.prog }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div class=\"pad sec stack\" style=\"gap:12px\">\n        <div class=\"field\">\n          <label>Session warm-up — carries over between {{ sesDayName }} sessions<\u002Flabel>\n          <textarea class=\"input\" placeholder=\"General warm-up for this day type…\" value=\"{{ warmNote }}\" sc-camel-on-change=\"{{ onWarmNote }}\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label>Day-type notes — carries over<\u002Flabel>\n          <textarea class=\"input\" placeholder=\"Junk volume, standing reminders…\" value=\"{{ otherNote }}\" sc-camel-on-change=\"{{ onOtherNote }}\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label>Notes for this session only<\u002Flabel>\n          <textarea class=\"input\" placeholder=\"Sleep, energy, what happened today…\" value=\"{{ sesNote }}\" sc-camel-on-change=\"{{ onSesNote }}\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <sc-if value=\"{{ sesHasEx }}\" hint-placeholder-val=\"{{ true }}\">\n          <div class=\"field\" style=\"max-width:150px\">\n            <label>Duration (min)<\u002Flabel>\n            <input class=\"input\" inputmode=\"numeric\" placeholder=\"–\" value=\"{{ sesDur }}\" sc-camel-on-change=\"{{ onSesDur }}\">\n          <\u002Fdiv>\n          <button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ addExercise }}\">+ Add an exercise to this session<\u002Fbutton>\n        <\u002Fsc-if>\n        <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ finish }}\">Save &amp; close<\u002Fbutton>\n        <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ removeSession }}\">Delete this session<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isEx }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"pad sec\">\n        <div class=\"row\" style=\"gap:8px;align-items:center\">\n          <span class=\"idtag\">{{ exId }}<\u002Fspan>\n          <div class=\"h-sec grow\">{{ exName }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"alt\" style=\"margin-top:4px\">{{ exAltNote }}<\u002Fdiv>\n        <div class=\"chips\" style=\"margin-top:8px\">\n          <sc-for list=\"{{ exMuscles }}\" as=\"m\" hint-placeholder-count=\"2\">\n            <span class=\"{{ m.cls }}\">{{ m.txt }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div class=\"muted mini\" style=\"margin-top:10px\">{{ exBest }}<\u002Fdiv>\n        <div class=\"muted mini\">{{ exBest1rm }}<\u002Fdiv>\n        <div class=\"row\" style=\"gap:8px;margin-top:12px;flex-wrap:wrap\">\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ switchAlt }}\">Switch to alternative<\u002Fbutton>\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ togglePic }}\">{{ picBtn }}<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ showPic }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"stack\" style=\"gap:8px\">\n            <sc-if value=\"{{ hasPic }}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"picwrap picimg\" style=\"{{ picStyle }}\" role=\"img\" aria-label=\"Setup photo\"><\u002Fdiv>\n            <\u002Fsc-if>\n            <div class=\"row\" style=\"gap:8px;flex-wrap:wrap\">\n              <label class=\"btn btn-secondary\" style=\"cursor:pointer\">{{ picAddLabel }}\n                <input type=\"file\" accept=\"image/*\" style=\"display:none\" sc-camel-on-change=\"{{ onPicFile }}\">\n              <\u002Flabel>\n              <sc-if value=\"{{ hasPic }}\" hint-placeholder-val=\"{{ false }}\">\n                <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ removePic }}\">Remove photo<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div class=\"pad sec\">\n        <div class=\"row\" style=\"gap:12px\">\n          <div class=\"timer-val grow\">{{ timerText }}<\u002Fdiv>\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ toggleTimer }}\">{{ timerBtn }}<\u002Fbutton>\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ resetTimer }}\">Reset<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"muted mini\" style=\"margin-top:8px\">Counts up from zero. Keeps running if you switch to another app.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"pad\">\n        <div class=\"setrow\">\n          <span class=\"lbl\">#<\u002Fspan><span class=\"lbl\">kg<\u002Fspan><span class=\"lbl\">Reps<\u002Fspan><span class=\"lbl\">{{ prevHead }}<\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{ setRows }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <div class=\"setrow\">\n            <span class=\"muted\" style=\"font-size:12px\">{{ s.i }}<\u002Fspan>\n            <input class=\"input num-in\" placeholder=\"–\" data-i=\"{{ s.idx }}\" data-f=\"w\" value=\"{{ s.w }}\" sc-camel-on-change=\"{{ onSet }}\">\n            <input class=\"input num-in\" inputmode=\"numeric\" placeholder=\"–\" data-i=\"{{ s.idx }}\" data-f=\"r\" value=\"{{ s.r }}\" sc-camel-on-change=\"{{ onSet }}\">\n            <span class=\"{{ s.cls }}\" style=\"font-size:11px;white-space:nowrap\">{{ s.prev }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div class=\"row\" style=\"gap:8px;margin-top:10px\">\n          <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ addSet }}\">+ Set<\u002Fbutton>\n          <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ dropSet }}\">– Set<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"muted mini\" style=\"margin-top:10px\">Weight takes text too — type Green for a band. Green: heavier, or same weight for more reps. Yellow: identical. Red: lighter or fewer reps.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"pad sec\">\n        <div class=\"lbl\" style=\"margin-bottom:2px\">Notes — global for {{ exId }}, carries over<\u002Fdiv>\n        <sc-for list=\"{{ noteFields }}\" as=\"n\" hint-placeholder-count=\"4\">\n          <div class=\"field notesec\">\n            <label>{{ n.label }}<\u002Flabel>\n            <textarea class=\"input\" data-f=\"{{ n.key }}\" placeholder=\"{{ n.ph }}\" value=\"{{ n.val }}\" sc-camel-on-change=\"{{ onNoteField }}\"><\u002Ftextarea>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div class=\"pad\">\n        <div class=\"row\" style=\"gap:8px\">\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ prevExercise }}\" aria-label=\"Previous exercise\">‹<\u002Fbutton>\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ nextExercise }}\" aria-label=\"Next exercise\">›<\u002Fbutton>\n          <button class=\"btn btn-secondary grow\" sc-camel-on-click=\"{{ seeTrend }}\">Trend<\u002Fbutton>\n          <button class=\"btn btn-primary grow\" sc-camel-on-click=\"{{ back }}\">Back to day<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isSwap }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"pad\">\n        <div class=\"muted mini\">{{ swapHint }}<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{ swapRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n        <div>\n          <sc-if value=\"{{ r.showHead }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"pad lbl\" style=\"padding-bottom:2px\">{{ r.head }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <button class=\"item\" data-k=\"{{ r.id }}\" sc-camel-on-click=\"{{ onSwapPick }}\">\n            <span class=\"idtag\">{{ r.id }}<\u002Fspan>\n            <span class=\"grow\">\n              <span class=\"item-name\">{{ r.name }}<\u002Fspan>\n              <span class=\"muted\" style=\"display:block;font-size:11px\">{{ r.sub }}<\u002Fspan>\n            <\u002Fspan>\n            <span class=\"muted\">›<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div class=\"pad\">\n        <button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ swapNew }}\">+ Brand-new exercise<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isTrends }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"pad sec\">\n        <div class=\"field\">\n          <label>Exercise (all-time pool, by ID)<\u002Flabel>\n          <sc-raw-select class=\"input\" value=\"{{ trendEx }}\" sc-camel-on-change=\"{{ onTrendEx }}\">\n            <sc-for list=\"{{ exOptions }}\" as=\"o\" hint-placeholder-count=\"6\">\n              <option value=\"{{ o.id }}\">{{ o.label }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n        <div class=\"field\" style=\"margin-top:12px\">\n          <label>Scope<\u002Flabel>\n          <sc-raw-select class=\"input\" value=\"{{ trendScope }}\" sc-camel-on-change=\"{{ onTrendScope }}\">\n            <sc-for list=\"{{ scopeOptions }}\" as=\"o\" hint-placeholder-count=\"3\">\n              <option value=\"{{ o.v }}\">{{ o.n }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n        <div class=\"chips\" style=\"margin-top:12px\">\n          <sc-for list=\"{{ metrics }}\" as=\"m\" hint-placeholder-count=\"4\">\n            <button class=\"{{ m.cls }}\" data-m=\"{{ m.id }}\" sc-camel-on-click=\"{{ onMetric }}\">{{ m.name }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"pad sec\">\n        <div class=\"lbl\">{{ chartTitle }}<\u002Fdiv>\n        <div class=\"bars\" style=\"margin:14px 0 6px\">\n          <sc-for list=\"{{ chartCols }}\" as=\"c\" hint-placeholder-count=\"6\">\n            <div class=\"barcol\">\n              <sc-for list=\"{{ c.bars }}\" as=\"b\" hint-placeholder-count=\"3\">\n                <div class=\"bar\" style=\"{{ b.style }}\"><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div class=\"row\" style=\"gap:6px\">\n          <sc-for list=\"{{ chartCols }}\" as=\"c\" hint-placeholder-count=\"6\">\n            <span class=\"grow muted\" style=\"font-size:9px;text-align:center;min-width:0\">{{ c.label }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div class=\"chips\" style=\"margin-top:14px;gap:10px\">\n          <sc-for list=\"{{ chartLegend }}\" as=\"l\" hint-placeholder-count=\"3\">\n            <span class=\"row\" style=\"gap:6px;font-size:11px\"><span style=\"{{ l.style }}\"><\u002Fspan>{{ l.name }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div class=\"muted mini\" style=\"margin-top:12px\">{{ chartFoot }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"pad sec\">\n        <div class=\"lbl\" style=\"margin-bottom:6px\">All-time best — {{ trendLabel }}<\u002Fdiv>\n        <div style=\"font-size:13px\">{{ exBestTrend }}<\u002Fdiv>\n        <div class=\"muted mini\" style=\"margin-top:4px\">{{ exBest1rmTrend }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"pad sec\">\n        <div class=\"lbl\">Bodyweight<\u002Fdiv>\n        <div class=\"bars\" style=\"margin:14px 0 6px;height:90px\">\n          <sc-for list=\"{{ bwCols }}\" as=\"c\" hint-placeholder-count=\"8\">\n            <div class=\"barcol\"><div class=\"bar\" style=\"{{ c.style }}\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div class=\"row\" style=\"gap:6px\">\n          <sc-for list=\"{{ bwCols }}\" as=\"c\" hint-placeholder-count=\"8\">\n            <span class=\"grow muted\" style=\"font-size:9px;text-align:center;min-width:0\">{{ c.label }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div class=\"muted mini\" style=\"margin-top:10px\">{{ bwFoot }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"pad\">\n        <div class=\"lbl\" style=\"margin-bottom:6px\">Per muscle — this week vs last<\u002Fdiv>\n        <sc-raw-table class=\"table\">\n          <sc-raw-thead><sc-raw-tr><sc-raw-th>Muscle<\u002Fsc-raw-th><sc-raw-th>Volume<\u002Fsc-raw-th><sc-raw-th>Δ<\u002Fsc-raw-th><sc-raw-th>Sets<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ muscleRows }}\" as=\"m\" hint-placeholder-count=\"8\">\n              <sc-raw-tr>\n                <sc-raw-td>{{ m.name }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"font-variant-numeric:tabular-nums\">{{ m.vol }}<\u002Fsc-raw-td>\n                <sc-raw-td class=\"{{ m.cls }}\" style=\"font-variant-numeric:tabular-nums\">{{ m.delta }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"font-variant-numeric:tabular-nums\">{{ m.sets }}<\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n        <div class=\"muted mini\" style=\"margin-top:10px\">Weighted by each exercise’s muscle factors (1 / 0.5 / 0.33 by default).<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isSetup }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"pad sec\">\n        <div class=\"field\">\n          <label>Username<\u002Flabel>\n          <input class=\"input\" placeholder=\"Your name\" value=\"{{ user }}\" sc-camel-on-change=\"{{ onUser }}\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stack\">\n        <button class=\"item\" sc-camel-on-click=\"{{ goLib }}\">\n          <span class=\"grow\">\n            <span class=\"item-name\">Exercises<\u002Fspan>\n            <span class=\"muted\" style=\"display:block;font-size:11px\">{{ libSummary }}<\u002Fspan>\n          <\u002Fspan>\n          <span class=\"muted\">›<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"pad\">\n        <div class=\"lbl\">Day type presets<\u002Fdiv>\n        <div class=\"muted mini\" style=\"margin-top:6px\">Editing a preset never changes sessions you already logged.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stack\">\n        <sc-for list=\"{{ presetList }}\" as=\"d\" hint-placeholder-count=\"10\">\n          <button class=\"item\" data-k=\"{{ d.id }}\" sc-camel-on-click=\"{{ onEditPreset }}\">\n            <span class=\"{{ d.cls }}\" style=\"{{ d.style }}\"><\u002Fspan>\n            <span class=\"grow\">\n              <span class=\"item-name\">{{ d.name }}<\u002Fspan>\n              <span class=\"muted\" style=\"display:block;font-size:11px\">{{ d.sub }}<\u002Fspan>\n            <\u002Fspan>\n            <span class=\"muted mini\">edit ›<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div class=\"pad sec\">\n        <button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ newPreset }}\">+ New day type<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"pad sec stack\" style=\"gap:10px\">\n        <div class=\"lbl\">Google Drive sync<\u002Fdiv>\n        <div class=\"field\">\n          <label>Sync address (ends in /exec)<\u002Flabel>\n          <input class=\"input\" placeholder=\"https://script.google.com/macros/s/…/exec\" value=\"{{ syncUrlVal }}\" sc-camel-on-change=\"{{ onSyncUrl }}\">\n        <\u002Fdiv>\n        <div class=\"row\" style=\"gap:8px\">\n          <button class=\"btn btn-primary grow\" sc-camel-on-click=\"{{ syncNow }}\">Sync now<\u002Fbutton>\n          <button class=\"btn btn-secondary grow\" sc-camel-on-click=\"{{ pullNow }}\">Load from cloud<\u002Fbutton>\n        <\u002Fdiv>\n        <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ testSync }}\">Test connection<\u002Fbutton>\n        <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ pullForce }}\">Force-replace this device with the cloud copy<\u002Fbutton>\n        <div class=\"{{ syncCls }}\" style=\"font-size:11px\">{{ syncStatus }}<\u002Fdiv>\n        <div class=\"muted mini\">Saves itself a few seconds after any change, and whenever you leave the app. Setup photos stay on this device — they are too big to sync; use a JSON backup to carry them across.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pad sec stack\" style=\"gap:10px\">\n        <div class=\"lbl\">Backup &amp; spreadsheet<\u002Fdiv>\n        <div class=\"muted mini\">{{ dataSummary }}<\u002Fdiv>\n        <button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ doXlsx }}\">Export Excel (.xlsx)<\u002Fbutton>\n        <label class=\"btn btn-secondary btn-block\" style=\"cursor:pointer\">Import Excel\n          <input type=\"file\" accept=\".xlsx\" style=\"display:none\" sc-camel-on-change=\"{{ onXlsxFile }}\">\n        <\u002Flabel>\n        <div class=\"muted mini\">{{ xlsxStatus }}<\u002Fdiv>\n        <button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ doExport }}\">Export full backup (.json)<\u002Fbutton>\n        <label class=\"btn btn-secondary btn-block\" style=\"cursor:pointer\">Import backup\n          <input type=\"file\" accept=\"application/json\" style=\"display:none\" sc-camel-on-change=\"{{ doImport }}\">\n        <\u002Flabel>\n      <\u002Fdiv>\n      <div class=\"pad stack\" style=\"gap:10px\">\n        <div class=\"lbl\">Reset<\u002Fdiv>\n        <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ clearAll }}\">Delete all sessions<\u002Fbutton>\n        <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ reseed }}\">Reload library from your list<\u002Fbutton>\n        <div class=\"muted mini\">Stored on this device only. Excel round-trips the library and current weights; JSON is the lossless backup.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isLib }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"pad\">\n        <div class=\"muted mini\">Sorted by primary muscle. The ID pools all-time bests independent of day or order.<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{ libRows }}\" as=\"r\" hint-placeholder-count=\"12\">\n        <div>\n          <sc-if value=\"{{ r.showHead }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"pad lbl\" style=\"padding-bottom:2px\">{{ r.head }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <button class=\"item\" data-k=\"{{ r.id }}\" sc-camel-on-click=\"{{ onEditEx }}\">\n            <span class=\"idtag\">{{ r.id }}<\u002Fspan>\n            <span class=\"grow\">\n              <span class=\"item-name\">{{ r.name }}<\u002Fspan>\n              <span class=\"muted\" style=\"display:block;font-size:11px\">{{ r.sub }}<\u002Fspan>\n            <\u002Fspan>\n            <span class=\"muted mini\">edit ›<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div class=\"pad\">\n        <button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ newEx }}\">+ New exercise<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isExEdit }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"pad sec stack\" style=\"gap:14px\">\n        <div class=\"row\" style=\"gap:10px;align-items:center\">\n          <span class=\"idtag\">{{ eeId }}<\u002Fspan>\n          <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ eeRecalc }}\">Recompute ID<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label>Name<\u002Flabel>\n          <input class=\"input\" value=\"{{ eeName }}\" sc-camel-on-change=\"{{ onEeName }}\">\n        <\u002Fdiv>\n        <sc-for list=\"{{ eeNotes }}\" as=\"n\" hint-placeholder-count=\"4\">\n          <div class=\"field\">\n            <label>{{ n.label }}<\u002Flabel>\n            <textarea class=\"input\" data-f=\"{{ n.key }}\" placeholder=\"{{ n.ph }}\" value=\"{{ n.val }}\" sc-camel-on-change=\"{{ onEeNote }}\"><\u002Ftextarea>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div class=\"stack\" style=\"gap:8px\">\n          <div class=\"lbl\">Setup photo<\u002Fdiv>\n          <sc-if value=\"{{ eeHasPic }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"picwrap picimg\" style=\"{{ eePicStyle }}\" role=\"img\" aria-label=\"Setup photo\"><\u002Fdiv>\n          <\u002Fsc-if>\n          <div class=\"row\" style=\"gap:8px;flex-wrap:wrap\">\n            <label class=\"btn btn-secondary\" style=\"cursor:pointer\">{{ eePicLabel }}\n              <input type=\"file\" accept=\"image/*\" style=\"display:none\" sc-camel-on-change=\"{{ onEePicFile }}\">\n            <\u002Flabel>\n            <sc-if value=\"{{ eeHasPic }}\" hint-placeholder-val=\"{{ false }}\">\n              <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ eeRemovePic }}\">Remove<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pad sec stack\" style=\"gap:12px\">\n        <div class=\"lbl\">Muscles &amp; volume factors<\u002Fdiv>\n        <sc-for list=\"{{ eeMuscles }}\" as=\"m\" hint-placeholder-count=\"4\">\n          <div class=\"musrow\">\n            <div class=\"field\">\n              <label>{{ m.label }}<\u002Flabel>\n              <sc-raw-select class=\"input\" data-i=\"{{ m.idx }}\" data-f=\"m\" value=\"{{ m.m }}\" sc-camel-on-change=\"{{ onEeMuscle }}\">\n                <sc-for list=\"{{ muscleOptions }}\" as=\"o\" hint-placeholder-count=\"20\">\n                  <option value=\"{{ o.v }}\">{{ o.n }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label>Factor<\u002Flabel>\n              <input class=\"input num-in\" inputmode=\"decimal\" data-i=\"{{ m.idx }}\" data-f=\"f\" value=\"{{ m.f }}\" sc-camel-on-change=\"{{ onEeMuscle }}\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div class=\"muted mini\">Every logged set adds weight × reps × factor to that muscle’s volume, and the factor to its set count.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pad stack\" style=\"gap:10px\">\n        <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ back }}\">Done<\u002Fbutton>\n        <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ eeDelete }}\">Delete this exercise<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isPreset }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"pad sec stack\" style=\"gap:14px\">\n        <div class=\"row\" style=\"gap:12px\">\n          <div class=\"field grow\">\n            <label>Name<\u002Flabel>\n            <input class=\"input\" value=\"{{ pName }}\" sc-camel-on-change=\"{{ onPName }}\">\n          <\u002Fdiv>\n          <div class=\"field\" style=\"width:96px\">\n            <label>Calendar code<\u002Flabel>\n            <input class=\"input\" value=\"{{ pShort }}\" sc-camel-on-change=\"{{ onPShort }}\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div class=\"lbl\" style=\"margin-bottom:8px\">Colour<\u002Fdiv>\n          <div class=\"chips\" style=\"gap:12px\">\n            <sc-for list=\"{{ swatches }}\" as=\"s\" hint-placeholder-count=\"8\">\n              <button class=\"{{ s.cls }}\" style=\"{{ s.style }}\" data-c=\"{{ s.c }}\" sc-camel-on-click=\"{{ onPColor }}\" aria-label=\"Colour\"><\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"row\" style=\"gap:18px;flex-wrap:wrap\">\n          <label class=\"radio\"><input type=\"checkbox\" checked=\"{{ pHo }}\" sc-camel-on-change=\"{{ onPHo }}\"><span class=\"dot\"><\u002Fspan>Home-gym version<\u002Flabel>\n          <label class=\"radio\"><input type=\"checkbox\" checked=\"{{ pCardio }}\" sc-camel-on-change=\"{{ onPCardio }}\"><span class=\"dot\"><\u002Fspan>Cardio day<\u002Flabel>\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label>Session warm-up note<\u002Flabel>\n          <textarea class=\"input\" value=\"{{ pWarm }}\" sc-camel-on-change=\"{{ onPWarm }}\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label>Day-type notes<\u002Flabel>\n          <textarea class=\"input\" value=\"{{ pOther }}\" sc-camel-on-change=\"{{ onPOther }}\"><\u002Ftextarea>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ pShowEx }}\" hint-placeholder-val=\"{{ true }}\">\n        <div class=\"pad\" style=\"padding-bottom:0\">\n          <div class=\"lbl\">Exercises<\u002Fdiv>\n          <div class=\"muted mini\" style=\"margin-top:4px\">Current weights are the baseline this day compares against until you log a session of it.<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ pEx }}\" as=\"e\" hint-placeholder-count=\"6\">\n          <div class=\"exedit stack\" style=\"gap:10px\">\n            <div class=\"row\" style=\"gap:8px\">\n              <div class=\"field grow\">\n                <label>{{ e.pos }}. Exercise<\u002Flabel>\n                <sc-raw-select class=\"input\" data-i=\"{{ e.idx }}\" data-f=\"exid\" value=\"{{ e.exid }}\" sc-camel-on-change=\"{{ onItemField }}\">\n                  <sc-for list=\"{{ exOptions }}\" as=\"o\" hint-placeholder-count=\"12\">\n                    <option value=\"{{ o.id }}\">{{ o.label }}<\u002Foption>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n              <div class=\"field\" style=\"width:64px\">\n                <label>Sets<\u002Flabel>\n                <input class=\"input num-in\" inputmode=\"numeric\" data-i=\"{{ e.idx }}\" data-f=\"sets\" value=\"{{ e.sets }}\" sc-camel-on-change=\"{{ onItemField }}\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"field\">\n              <label>Current weights<\u002Flabel>\n              <input class=\"input\" placeholder=\"42x8; 40x6\" data-i=\"{{ e.idx }}\" data-f=\"cur\" value=\"{{ e.cur }}\" sc-camel-on-change=\"{{ onItemField }}\">\n            <\u002Fdiv>\n            <div class=\"row\" style=\"gap:8px\">\n              <button class=\"btn btn-secondary btn-icon\" data-i=\"{{ e.idx }}\" sc-camel-on-click=\"{{ onExUp }}\" aria-label=\"Move up\">↑<\u002Fbutton>\n              <button class=\"btn btn-secondary btn-icon\" data-i=\"{{ e.idx }}\" sc-camel-on-click=\"{{ onExDown }}\" aria-label=\"Move down\">↓<\u002Fbutton>\n              <span class=\"muted mini grow\">{{ e.sub }}<\u002Fspan>\n              <button class=\"btn btn-ghost\" data-i=\"{{ e.idx }}\" sc-camel-on-click=\"{{ onExRemove }}\">Remove<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div class=\"pad\">\n          <button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ onExAdd }}\">+ Add exercise<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div class=\"pad stack\" style=\"gap:10px\">\n        <button class=\"btn btn-primary btn-block\" sc-camel-on-click=\"{{ back }}\">Done<\u002Fbutton>\n        <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ onPDelete }}\">Delete this day type<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  <div class=\"tabbar\">\n    <button class=\"{{ tabCal }}\" sc-camel-on-click=\"{{ goCal }}\">Calendar<\u002Fbutton>\n    <button class=\"{{ tabTrends }}\" sc-camel-on-click=\"{{ goTrends }}\">Trends<\u002Fbutton>\n    <button class=\"{{ tabSetup }}\" sc-camel-on-click=\"{{ goSetup }}\">Setup<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;storageKey&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;wt_v4&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nvar SEED = window.WT_SEED || { MUS:[['Chest','C']], EX:[], DAYS:[] };\nvar MUS = SEED.MUS;\nvar MUSCLES = MUS.map(function(m){ return m[0]; });\nvar ABBR = {}; MUS.forEach(function(m){ ABBR[m[0]] = m[1]; });\nvar FACT = [1, 0.5, 0.33, 0.33];\nvar SLOTS = ['Primary','Secondary','Tertiary','Quaternary'];\nvar PALETTE = ['var(--color-accent)','var(--color-accent-2)','var(--color-process-yellow)','var(--color-text)','var(--color-accent-800)','var(--color-accent-2-700)','var(--color-accent-500)','var(--color-neutral-500)'];\nvar SET_INK = ['var(--color-accent-700)','var(--color-accent-500)','var(--color-accent-300)','var(--color-accent-200)'];\nvar MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];\nvar HOUSE = '\\u2302';\nvar CARDIO_TYPES = [['run','\\uD83C\\uDFC3 Run'],['cycle','\\uD83D\\uDEB4 Cycle'],['hike','\\uD83E\\uDD7E Hike'],['kickbox','\\uD83E\\uDD4A Kickbox'],['other','\\u26A1 Other']];\nvar CARDIO_EMOJI = { run:'\\uD83C\\uDFC3', cycle:'\\uD83D\\uDEB4', hike:'\\uD83E\\uDD7E', kickbox:'\\uD83E\\uDD4A', other:'\\u26A1' };\nvar INTENSITIES = ['Easy','Zone 2','Moderate','Hard','Intervals'];\nvar NOTE_KEYS = [['rep','Rep range','5-8'],['warm','Warm-up sets','2'],['setup','Setup','Seat height, pin, attachment\\u2026'],['other','Other','Cues, alternatives\\u2026']];\n\nfunction pad2(n){ return (n<10?'0':'')+n; }\nfunction iso(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }\nfunction fromISO(s){ var p=String(s).split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }\nfunction monday(d){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }\nfunction addDays(d,n){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }\nfunction num(v){ var n=parseFloat(String(v).replace(',','.')); return isFinite(n)?n:0; }\nfunction isNum(v){ return v!=='' && v!==null && v!==undefined && isFinite(parseFloat(String(v).replace(',','.'))); }\nfunction fmt(n){ return n>=10000 ? Math.round(n/1000)+'k' : String(Math.round(n)); }\nfunction pct(a,b){ return b ? Math.round((a-b)/b*100) : null; }\nfunction pctTxt(p){ return p===null ? '\\u2014' : (p>=0?'+':'')+p+'%'; }\nfunction cntTxt(d){ return d===0 ? 'same as last week' : (d>0?'+':'')+d+(Math.abs(d)===1?' session':' sessions'); }\nfunction cls3(x){ return x===null ? 'muted' : (x>0?'up':(x<0?'down':'same')); }\nfunction e1rm(w,r){ return w*(1+r/30); }\n// 'seed:<key>' points at a photo bundled with the app; anything else is a data URI\n// the user shot themselves.\nfunction picUrl(pic){\n  if(!pic) return '';\n  if(pic.indexOf('seed:') === 0) return (SEED.PICS || {})[pic.slice(5)] || '';\n  return pic;\n}\n\nfunction parseSets(str){\n  if(!str) return [];\n  var s = String(str);\n  var chunks = s.indexOf(';') >= 0 ? s.split(';') : s.split(/,(?=\\s)/);\n  var out = [];\n  chunks.forEach(function(c){\n    c = c.replace(/\\+\\s*p/ig,'').trim();\n    if(!c) return;\n    var m = /^(.*?)\\s*[x*\\u00d7]\\s*(\\d+)\\s*$/i.exec(c);\n    if(m){\n      var w = m[1].trim();\n      out.push({ w: isNum(w) ? String(num(w)) : w, r: m[2] });\n    } else out.push({ w:c, r:'' });\n  });\n  return out;\n}\nfunction setsToStr(sets){\n  return (sets||[]).filter(function(s){ return s.r!=='' || s.w!==''; })\n    .map(function(s){ return (s.w===''?'0':s.w) + 'x' + s.r; }).join('; ');\n}\nfunction nextId(list, primary){\n  var ab = ABBR[primary] || 'X', used = {};\n  list.forEach(function(e){ used[e.id] = 1; });\n  var n = 1;\n  while(used[ab+n]) n++;\n  return ab+n;\n}\nfunction seedDb(){\n  var exercises = [], byMuscle = {};\n  SEED.EX.forEach(function(e){ var p = e[1][0]; (byMuscle[p] = byMuscle[p] || []).push(e); });\n  MUSCLES.forEach(function(mName){\n    (byMuscle[mName]||[]).forEach(function(e){\n      exercises.push({ id: nextId(exercises, e[1][0]), name:e[0],\n        muscles: e[1].map(function(m,i){ return { m:m, f: FACT[i]===undefined?0.33:FACT[i] }; }),\n        rep:e[2]||'', warm:e[3]||'', setup:e[4]||'', other:e[5]||'', pic:e[6]||'' });\n    });\n  });\n  var byName = {}; exercises.forEach(function(e){ byName[e.name] = e; });\n  var presets = SEED.DAYS.map(function(d){\n    return { id:d[0], name:d[1], short:d[2], color:PALETTE[d[3]], ho:d[4], cardio:(d[0]==='CARDIO'),\n      warmNote:d[5]||'', otherNote:d[6]||'',\n      items:(d[7]||[]).filter(function(x){ return byName[x[0]]; }).map(function(x){\n        return { exid: byName[x[0]].id, sets:x[1], cur:x[2]||'' }; }) };\n  });\n  return { v:4, seedVersion:SEED.VERSION, user:'', exercises:exercises, presets:presets, sessions:[], bw:{} };\n}\n// Fold newly-added seed exercises and day types into an existing log.\n// Never touches sessions, and never overwrites anything the user has edited.\nfunction mergeSeed(db){\n  var added = { ex:0, days:0, filled:0, pics:0 };\n  // Old logs stored setup photos as a file path, which cannot work in a standalone\n  // file. Repoint them at the copy bundled with the app.\n  (db.exercises||[]).forEach(function(e){\n    if(!e.pic || e.pic.indexOf('assets/') !== 0) return;\n    var key = e.pic.replace(/^assets\\/(pic-)?/, '').replace(/\\.[a-z]+$/i, '');\n    if((SEED.PICS||{})[key]){ e.pic = 'seed:' + key; added.pics++; }\n    else e.pic = '';\n  });\n  var byName = {};\n  (db.exercises||[]).forEach(function(e){ byName[e.name.trim().toLowerCase()] = e; });\n  SEED.EX.forEach(function(e){\n    if(byName[e[0].trim().toLowerCase()]) return;\n    var fresh = { id: nextId(db.exercises, e[1][0]), name:e[0],\n      muscles: e[1].map(function(m,i){ return { m:m, f: FACT[i]===undefined?0.33:FACT[i] }; }),\n      rep:e[2]||'', warm:e[3]||'', setup:e[4]||'', other:e[5]||'', pic:e[6]||'' };\n    db.exercises.push(fresh);\n    byName[fresh.name.trim().toLowerCase()] = fresh;\n    added.ex++;\n  });\n  SEED.DAYS.forEach(function(d){\n    var items = (d[7]||[]).filter(function(x){ return byName[x[0].trim().toLowerCase()]; })\n      .map(function(x){ return { exid: byName[x[0].trim().toLowerCase()].id, sets:x[1], cur:x[2]||'' }; });\n    var p = (db.presets||[]).find(function(x){ return x.id===d[0]; });\n    if(!p){\n      db.presets.push({ id:d[0], name:d[1], short:d[2], color:PALETTE[d[3]], ho:d[4],\n        cardio:(d[0]==='CARDIO'), warmNote:d[5]||'', otherNote:d[6]||'', items:items });\n      added.days++;\n      return;\n    }\n    // only fill a day that is still empty — an edited preset is the user's\n    if(!p.cardio && !(p.items||[]).length && items.length){ p.items = items; added.filled++; }\n  });\n  db.seedVersion = SEED.VERSION;\n  return added;\n}\nfunction snapshot(dateISO, p){\n  return { date:dateISO, pid:p.id, name:p.name, short:p.short, color:p.color, ho:!!p.ho, cardio:!!p.cardio,\n    note:'', dur:'', cType:'run', cInt:'Zone 2', cOther:'',\n    entries:(p.items||[]).map(function(it){\n      var sets = [], n = num(it.sets)||1;\n      for(var i=0;i<n;i++) sets.push({ w:'', r:'' });\n      return { exid:it.exid, defExid:it.exid, sets:sets };\n    }) };\n}\n\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    var t = new Date();\n    var tm = this.loadTimer();\n    this.state = { db:this.load(), screen:'cal',\n      cursor: iso(new Date(t.getFullYear(), t.getMonth(), 1)),\n      sesDate:null, exIdx:0, pickDate:null, editId:null, editExId:null,\n      metric:'vol', trendEx:null, trendScope:'all', showPic:false, xlsxStatus:'',\n      syncStatus:'', syncAt:0,\n      tStart:tm.tStart, tAcc:tm.tAcc, tick:0 };\n  }\n  key(){ return this.props.storageKey || 'wt_v4'; }\n  load(){\n    try {\n      var raw = localStorage.getItem(this.key());\n      if(raw){\n        var d = JSON.parse(raw);\n        if(d && d.v===4 && d.exercises){\n          if(d.seedVersion !== SEED.VERSION){\n            var got = mergeSeed(d);\n            this.mergeReport = (got.ex || got.days || got.filled || got.pics)\n              ? ('Updated list: +' + got.ex + ' exercises, +' + got.days + ' day types, ' + got.filled + ' days filled in'\n                 + (got.pics ? ', ' + got.pics + ' setup photo(s) relinked' : '') + '. Your log is untouched.')\n              : '';\n            try { localStorage.setItem(this.key(), JSON.stringify(d)); } catch(e2){}\n          }\n          return d;\n        }\n      }\n    } catch(e){}\n    return seedDb();\n  }\n  save(db, fromRemote){\n    if(!fromRemote) db.updatedAt = Date.now();\n    this.setState({ db:db });\n    try { localStorage.setItem(this.key(), JSON.stringify(db)); }\n    catch(e){ alert('Storage is full \\u2014 remove a setup photo or export a backup.'); }\n    if(!fromRemote) this.pushSoon();\n  }\n  update(fn){ var db = JSON.parse(JSON.stringify(this.state.db)); fn(db); this.save(db); }\n  loadTimer(){\n    try { var raw = localStorage.getItem(this.key()+'_timer'); if(raw){ var t = JSON.parse(raw); return { tStart:t.tStart||null, tAcc:t.tAcc||0 }; } } catch(e){}\n    return { tStart:null, tAcc:0 };\n  }\n  setTimer(tStart, tAcc){\n    this.setState({ tStart:tStart, tAcc:tAcc });\n    try { localStorage.setItem(this.key()+'_timer', JSON.stringify({ tStart:tStart, tAcc:tAcc })); } catch(e){}\n  }\n  componentDidMount(){\n    this.iv = setInterval(()=>{ if(this.state.tStart) this.setState({ tick:Date.now() }); }, 250);\n    // ask the browser not to evict this origin's storage (installed page = usually granted)\n    if(navigator.storage && navigator.storage.persist){\n      navigator.storage.persisted().then((p)=>{ if(!p) return navigator.storage.persist(); }).catch(function(){});\n    }\n    if(this.syncUrl()) this.pull();\n    // flush pending changes when the app is backgrounded or closed\n    this.onHide = () => {\n      if(document.visibilityState === 'hidden' && this.syncUrl()){ clearTimeout(this.pushT); this.pushNow(); }\n    };\n    document.addEventListener('visibilitychange', this.onHide);\n  }\n  syncKey(){ return this.key()+'_syncurl'; }\n  syncUrl(){ try { return localStorage.getItem(this.syncKey()) || ''; } catch(e){ return ''; } }\n  setSyncUrl(u){\n    try { localStorage.setItem(this.syncKey(), u.trim()); } catch(e){}\n    this.setState({ syncStatus: u.trim() ? 'Address saved. Tap Sync now.' : 'Sync off.' });\n    if(u.trim()) this.pull();\n  }\n  // push the whole log to the Drive script, debounced\n  pushSoon(){\n    var self = this;\n    if(!this.syncUrl()) return;\n    clearTimeout(this.pushT);\n    this.setState({ syncStatus:'Saving\\u2026' });\n    this.pushT = setTimeout(function(){ self.pushNow(); }, 4000);\n  }\n  // Photos are far too big for the cloud slot (~480 KB total), so sync carries the log\n  // only. 'seed:' references are kept because they are just a few bytes.\n  stripPics(db){\n    var copy = JSON.parse(JSON.stringify(db));\n    (copy.exercises||[]).forEach(function(e){\n      if(e.pic && e.pic.indexOf('seed:') !== 0){ e.pic = ''; e.hadPic = true; }\n    });\n    return copy;\n  }\n  // An incoming copy has no photos in it — keep whatever this device already holds.\n  keepLocalPics(incoming){\n    var mine = {};\n    (this.state.db.e
