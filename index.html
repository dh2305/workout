f(primary)<0) primary = 'Chest';\n        var id = nextId(db.exercises||[], primary);\n        var addMode = st.exIdx < 0;\n        self.update(function(dd){\n          dd.exercises.push({ id:id, name:name, muscles:[{ m:primary, f:1 }], rep:'', warm:'', setup:'', other:'', pic:'' });\n          var s2 = dd.sessions.find(function(x){ return x.date===ses.date; }); if(!s2) return;\n          if(addMode) s2.entries.push({ exid:id, defExid:id, sets:[{w:'',r:''},{w:'',r:''},{w:'',r:''}] });\n          else { var en = s2.entries[st.exIdx]; en.exid = id; en.sets = en.sets.map(function(){ return { w:'', r:'' }; }); }\n        });\n        self.setState({ screen: addMode?'session':'ex', showPic:false });\n      };\n    } else { v.swapHint = ''; v.swapNew = function(){}; v.onSwapPick = function(){}; }\n    v.swapRows = swapRows;\n\n    // trends\n    var ids = exSorted.map(function(e){ return e.id; });\n    var tEx = st.trendEx && ids.indexOf(st.trendEx)>=0 ? st.trendEx : (ids[0]||'');\n    v.trendEx = tEx;\n    v.trendLabel = map[tEx] ? (tEx + ' ' + map[tEx].name) : tEx;\n    v.onTrendEx = function(e){ self.setState({ trendEx:e.target.value }); };\n    var dayOpts = (db.presets||[]).filter(function(p){ return !p.cardio; })\n      .map(function(p){ return { v:p.id, n:p.name + (p.ho?' '+HOUSE:'') }; });\n    v.scopeOptions = [{ v:'all', n:'All day types together' }].concat(dayOpts);\n    var scope = st.trendScope;\n    if(scope!=='all' && !(db.presets||[]).some(function(p){ return p.id===scope; })) scope = 'all';\n    v.trendScope = scope;\n    v.onTrendScope = function(e){ self.setState({ trendScope:e.target.value }); };\n    var METRICS = [{id:'vol',name:'Volume'},{id:'e1rm',name:'Est. 1RM'},{id:'top',name:'Weight'},{id:'reps',name:'Reps'}];\n    v.metrics = METRICS.map(function(m){ return { id:m.id, name:m.name, cls:'chip'+(st.metric===m.id?' on':'') }; });\n    v.onMetric = function(e){ self.setState({ metric:e.currentTarget.getAttribute('data-m') }); };\n    var hist = [];\n    this.ordered().forEach(function(s){\n      if(scope!=='all' && s.pid!==scope) return;\n      var e = (s.entries||[]).find(function(x){ return x.exid===tEx; });\n      if(e && e.sets.some(function(t){ return num(t.r)>0; })) hist.push({ date:s.date, sets:e.sets, short:s.short });\n    });\n    var recent = hist.slice(-8);\n    var metricOf = function(t){\n      var w = num(t.w), r = num(t.r);\n      if(!r) return 0;\n      if(st.metric==='vol') return (w||1)*r;\n      if(st.metric==='e1rm') return e1rm(w,r);\n      if(st.metric==='top') return w;\n      return r;\n    };\n    var maxV=0;\n    recent.forEach(function(h){ h.sets.forEach(function(t){ var m=metricOf(t); if(m>maxV) maxV=m; }); });\n    v.chartCols = recent.map(function(h){\n      return { label:h.date.slice(5).replace('-','/'),\n        bars:h.sets.map(function(t,i){ var m=metricOf(t);\n          return { style:{ height:(maxV?Math.max(2,m/maxV*100):0)+'%', background:SET_INK[i%SET_INK.length] } }; }) };\n    });\n    var maxSets = recent.reduce(function(a,h){ return Math.max(a,h.sets.length); },0);\n    v.chartLegend = [];\n    for(var q=0;q<maxSets;q++) v.chartLegend.push({ name:'Set '+(q+1), style:{ width:'12px', height:'12px', background:SET_INK[q%SET_INK.length], flex:'none' } });\n    v.chartTitle = (METRICS.find(function(m){ return m.id===st.metric; })||METRICS[0]).name + ' per set';\n    v.chartFoot = recent.length\n      ? ('Last ' + recent.length + ' sessions' + (scope==='all'?'':' of that day type') + '. Set 1 is compared with set 1, never with set 2.')\n      : 'Nothing logged for this exercise in this scope yet.';\n    var bt = this.best(tEx), bt1 = this.best1rm(tEx);\n    v.exBestTrend = bt ? ((isNum(bt.w)&&num(bt.w)>0 ? bt.w+' kg' : (bt.w||'bodyweight')) + ' \\u00d7 ' + bt.r + ' reps \\u00b7 ' + bt.date) : 'Nothing logged yet.';\n    v.exBest1rmTrend = bt1 ? ('Best est. 1RM ' + Math.round(bt1.val) + ' kg (' + bt1.set.w + ' \\u00d7 ' + bt1.set.r + ')') : 'All-time figures pool every day type.';\n\n    var mNow = this.muscleIn(wkA,wkB), mPrev = this.muscleIn(lwA,lwB);\n    var mk = Object.keys(mNow).concat(Object.keys(mPrev)).filter(function(k,i,a){ return a.indexOf(k)===i; })\n      .sort(function(a,b){ return MUSCLES.indexOf(a)-MUSCLES.indexOf(b); });\n    v.muscleRows = mk.map(function(k){\n      var a = mNow[k]||{vol:0,sets:0}, b2 = mPrev[k]||{vol:0,sets:0};\n      var p = pct(a.vol,b2.vol);\n      return { name:k, vol:fmt(a.vol), sets:String(Math.round(a.sets*10)/10),\n        delta: b2.vol?pctTxt(p):(a.vol?'new':'\\u2014'), cls: b2.vol?cls3(p):'muted' };\n    });\n\n    // setup\n    v.onUser = function(e){ var val=e.target.value; self.update(function(dd){ dd.user=val; }); };\n    v.libSummary = (db.exercises||[]).length + ' exercises with IDs, notes and muscle factors';\n    v.dataSummary = db.sessions.length + ' sessions, ' + (db.presets||[]).length + ' day types, ' + (db.exercises||[]).length + ' exercises, ' + Object.keys(db.bw||{}).length + ' bodyweight entries.';\n    v.xlsxStatus = st.xlsxStatus;\n    v.syncUrlVal = this.syncUrl();\n    v.syncStatus = st.syncStatus || (this.syncUrl() ? 'Ready.' : 'Off \\u2014 paste your sync address to switch it on.');\n    v.syncCls = /fail|could not|empty/i.test(st.syncStatus||'') ? 'down' : (/synced|up to date|loaded/i.test(st.syncStatus||'') ? 'up' : 'muted');\n    v.onSyncUrl = function(e){ self.setSyncUrl(e.target.value); };\n    v.syncNow = function(){ clearTimeout(self.pushT); self.pushNow(); };\n    v.pullNow = function(){ self.pull(); };\n    v.pullForce = function(){\n      if(confirm('Replace everything on this device with what is currently in the cloud? This cannot be undone.')) self.pull(true);\n    };\n    v.pullForce = function(){\n      if(confirm('Replace everything on this device with what is currently in the cloud? This cannot be undone.')) self.pull(true);\n    };\n    v.testSync = function(){ self.diagnose(); };\n    v.doXlsx = function(){\n      self.buildXlsx().then(function(blob){ self.download(blob, 'workout-' + todayISO + '.xlsx'); })\n        .catch(function(err){ self.setState({ xlsxStatus:'Export failed: ' + err.message }); });\n    };\n    v.onXlsxFile = function(e){\n      var f = e.target.files && e.target.files[0]; if(!f) return;\n      window.WT_XLSX.read(f).then(function(book){ self.applyXlsx(book); })\n        .catch(function(err){ self.setState({ xlsxStatus:'Import failed: ' + err.message }); });\n    };\n    v.doExport = function(){ self.doBackup(); };\n    v.doImport = function(e){\n      var f = e.target.files && e.target.files[0]; if(!f) return;\n      var rd = new FileReader();\n      rd.onload = function(){\n        try {\n          var d = JSON.parse(rd.result);\n          if(d && d.sessions && d.presets && d.exercises){\n            if(confirm('Replace everything on this device with the backup?\\n\\n' + d.sessions.length + ' sessions, ' + d.exercises.length + ' exercises.')) self.save(d);\n          } else alert('That file is not a workout backup.');\n        } catch(err){ alert('Could not read that file.'); }\n      };\n      rd.readAsText(f);\n    };\n    v.clearAll = function(){ if(confirm('Delete all logged sessions? Library and presets stay.')) self.update(function(dd){ dd.sessions=[]; dd.bw={}; }); };\n    v.reseed = function(){ if(confirm('Reload the library and presets from your list? Logged sessions are deleted too.')){ var d=seedDb(); d.user=db.user; self.save(d); } };\n    v.onEditPreset = function(e){ self.setState({ screen:'preset', editId:e.currentTarget.getAttribute('data-k') }); };\n    v.newPreset = function(){\n      var id = 'P'+Date.now();\n      self.setState({ screen:'preset', editId:id });\n      self.update(function(dd){ dd.presets.push({ id:id, name:'New day', short:'NEW', color:PALETTE[0], ho:false, cardio:false, warmNote:'', otherNote:'', items:[] }); });\n    };\n\n    // exercise library + editor\n    var lastLibHead = null;\n    v.libRows = exSorted.map(function(e){\n      var head = e.muscles[0] ? e.muscles[0].m : 'Unassigned';\n      var show = head !== lastLibHead; lastLibHead = head;\n      var rest = e.muscles.slice(1).filter(function(m){ return m.m; }).map(function(m){ return m.m+' \\u00d7'+m.f; });\n      return { id:e.id, name:e.name, head:head, showHead:show,\n        sub:(rest.length ? rest.join(' \\u00b7 ') : 'primary only') + (e.pic?' \\u00b7 photo':'') };\n    });\n    v.onEditEx = function(e){ self.setState({ screen:'exedit', editExId:e.currentTarget.getAttribute('data-k') }); };\n    v.newEx = function(){\n      var id = nextId(db.exercises||[], 'Chest');\n      self.setState({ screen:'exedit', editExId:id });\n      self.update(function(dd){ dd.exercises.push({ id:id, name:'New exercise', muscles:[{m:'Chest',f:1}], rep:'', warm:'', setup:'', other:'', pic:'' }); });\n    };\n    var ee = (db.exercises||[]).find(function(e){ return e.id===st.editExId; });\n    var mutEe = function(fn){ self.update(function(dd){ var e=dd.exercises.find(function(x){ return x.id===st.editExId; }); if(e) fn(e,dd); }); };\n    v.muscleOptions = [{v:'',n:'\\u2014 none \\u2014'}].concat(MUSCLES.map(function(m){ return { v:m, n:m + ' (' + ABBR[m] + ')' }; }));\n    if(ee){\n      v.eeId = ee.id; v.eeName = ee.name;\n      v.eeNotes = NOTE_KEYS.map(function(k){ return { key:k[0], label:k[1], ph:k[2], val: ee[k[0]]||'' }; });\n      var eeHref = picUrl(ee.pic);\n      v.eeHasPic = !!eeHref; v.eePicStyle = eeHref ? { backgroundImage:'url(\"'+eeHref+'\")' } : {};\n      v.eePicLabel = ee.pic ? 'Replace photo' : 'Take or choose photo';\n      v.eeMuscles = [0,1,2,3].map(function(i){\n        var m = ee.muscles[i] || { m:'', f:FACT[i] };\n        return { idx:i, label:SLOTS[i], m:m.m||'', f:String(m.f===undefined?FACT[i]:m.f) };\n      });\n      v.onEeName = function(e){ var val=e.target.value; mutEe(function(x){ x.name=val; }); };\n      v.onEeNote = function(e){ var f=e.target.getAttribute('data-f'), val=e.target.value; mutEe(function(x){ x[f]=val; }); };\n      v.onEePicFile = function(e){\n        var f = e.target.files && e.target.files[0]; if(!f) return;\n        self.shrinkImage(f, function(url){ mutEe(function(x){ x.pic=url; }); });\n      };\n      v.eeRemovePic = function(){ mutEe(function(x){ x.pic=''; }); };\n      v.onEeMuscle = function(e){\n        var i2 = parseInt(e.target.getAttribute('data-i'),10), f = e.target.getAttribute('data-f'), val = e.target.value;\n        mutEe(function(x){\n          while(x.muscles.length < 4) x.muscles.push({ m:'', f:FACT[x.muscles.length] });\n          if(f==='m') x.muscles[i2].m = val;\n          else x.muscles[i2].f = Math.max(0, Math.min(1, num(val)));\n          x.muscles = x.muscles.filter(function(m,idx){ return m.m || idx===0; });\n        });\n      };\n      v.eeRecalc = function(){\n        var primary = ee.muscles[0] ? ee.muscles[0].m : 'Chest';\n        var others = (db.exercises||[]).filter(function(x){ return x.id!==ee.id; });\n        var fresh = nextId(others, primary);\n        if(fresh === ee.id) return;\n        if(!confirm('Change ID from ' + ee.id + ' to ' + fresh + '? Presets and logged sessions follow.')) return;\n        self.setState({ editExId:fresh });\n        self.update(function(dd){\n          var e = dd.exercises.find(function(x){ return x.id===ee.id; }); if(!e) return;\n          var old = e.id; e.id = fresh;\n          dd.presets.forEach(function(p){ (p.items||[]).forEach(function(it){ if(it.exid===old) it.exid = fresh; }); });\n          dd.sessions.forEach(function(s){ (s.entries||[]).forEach(function(en){\n            if(en.exid===old) en.exid = fresh;\n            if(en.defExid===old) en.defExid = fresh;\n          }); });\n        });\n      };\n      v.eeDelete = function(){\n        if(!confirm('Delete ' + ee.id + ' ' + ee.name + '? It is removed from presets; logged sessions keep their numbers.')) return;\n        self.setState({ screen:'lib' });\n        self.update(function(dd){\n          dd.exercises = dd.exercises.filter(function(x){ return x.id!==ee.id; });\n          dd.presets.forEach(function(p){ p.items = (p.items||[]).filter(function(it){ return it.exid!==ee.id; }); });\n        });\n      };\n    } else {\n      v.eeId=''; v.eeName=''; v.eeNotes=[]; v.eeMuscles=[]; v.eeHasPic=false; v.eePicStyle={}; v.eePicLabel='Add photo';\n    }\n\n    // preset editor\n    var pre = (db.presets||[]).find(function(p){ return p.id===st.editId; });\n    var mutP = function(fn){ self.update(function(dd){ var p=dd.presets.find(function(x){ return x.id===st.editId; }); if(p) fn(p); }); };\n    v.swatches = PALETTE.map(function(c){ return { c:c, cls:'sw'+(pre && pre.color===c?' on':''), style:{ background:c } }; });\n    if(pre){\n      v.pName = pre.name; v.pShort = pre.short; v.pHo = !!pre.ho; v.pCardio = !!pre.cardio; v.pShowEx = !pre.cardio;\n      v.pWarm = pre.warmNote||''; v.pOther = pre.otherNote||'';\n      v.pEx = (pre.items||[]).map(function(it,i){\n        var ex = map[it.exid];\n        var mus = ex ? ex.muscles.filter(function(m){ return m.m; }).map(function(m){ return m.m+' \\u00d7'+m.f; }).join(' \\u00b7 ') : 'missing exercise';\n        return { idx:i, pos:String(i+1), exid:it.exid, sets:String(it.sets), cur:it.cur||'', sub:mus };\n      });\n      v.onPName = function(e){ var val=e.target.value; mutP(function(p){ p.name=val; }); };\n      v.onPShort = function(e){ var val=e.target.value; mutP(function(p){ p.short=val; }); };\n      v.onPColor = function(e){ var c=e.currentTarget.getAttribute('data-c'); mutP(function(p){ p.color=c; }); };\n      v.onPHo = function(e){ var val=e.target.checked; mutP(function(p){ p.ho=val; }); };\n      v.onPCardio = function(e){ var val=e.target.checked; mutP(function(p){ p.cardio=val; }); };\n      v.onPWarm = function(e){ var val=e.target.value; mutP(function(p){ p.warmNote=val; }); };\n      v.onPOther = function(e){ var val=e.target.value; mutP(function(p){ p.otherNote=val; }); };\n      v.onItemField = function(e){\n        var i2=parseInt(e.target.getAttribute('data-i'),10), f=e.target.getAttribute('data-f'), val=e.target.value;\n        mutP(function(p){\n          if(f==='sets') p.items[i2].sets = Math.max(1, Math.min(12, parseInt(val,10)||1));\n          else p.items[i2][f] = val;\n        });\n      };\n      v.onExAdd = function(){ var firstId = exSorted[0] ? exSorted[0].id : ''; mutP(function(p){ p.items.push({ exid:firstId, sets:3, cur:'' }); }); };\n      v.onExRemove = function(e){ var i2=parseInt(e.currentTarget.getAttribute('data-i'),10); mutP(function(p){ p.items.splice(i2,1); }); };\n      v.onExUp = function(e){ var i2=parseInt(e.currentTarget.getAttribute('data-i'),10); if(i2>0) mutP(function(p){ var x=p.items.splice(i2,1)[0]; p.items.splice(i2-1,0,x); }); };\n      v.onExDown = function(e){ var i2=parseInt(e.currentTarget.getAttribute('data-i'),10); mutP(function(p){ if(i2<p.items.length-1){ var x=p.items.splice(i2,1)[0]; p.items.splice(i2+1,0,x); } }); };\n      v.onPDelete = function(){\n        if(!confirm('Delete this day type? Logged sessions are untouched.')) return;\n        self.setState({ screen:'setup' });\n        self.update(function(dd){ dd.presets = dd.presets.filter(function(p){ return p.id!==st.editId; }); });\n      };\n    } else {\n      v.pName=''; v.pShort=''; v.pHo=false; v.pCardio=false; v.pShowEx=true; v.pEx=[]; v.pWarm=''; v.pOther='';\n    }\n\n    return v;\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
